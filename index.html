<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive 3D Earth</title>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- OrbitControls for mouse interaction -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<!-- TWEEN.js for smooth animation -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>


<!-- Font -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    overflow: hidden;
    background-color: black;
    color: white;
    font-family: 'Press Start 2P', monospace;
  }

  #earth-container {
    width: 100vw;
    height: 100vh;
    cursor: grab;
  }

  #earth-container:active {
    cursor: grabbing;
  }

  #mapx {
    position: absolute;
    top: 20px;
    left: 20px;
    font-size: 12px;
  }

  #divein {
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 12px;
  }

  #city {
    position: absolute;
    top: 10%;
    width: 100%;
    text-align: center;
    font-size: 14px;
    letter-spacing: 2px;
    pointer-events: none; /* Make sure text doesn't interfere with dragging */
  }

  #footer {
    position: absolute;
    bottom: 30px;
    width: 100%;
    text-align: center;
    font-size: 10px;
    pointer-events: none;
  }

  #footer span {
    color: #ffb3b3;
  }
</style>
</head>
<body>
<div id="earth-container"></div>

<div id="mapx">📍 Mapx</div>
<div id="divein">DIVE IN →</div>
<div id="city">MUMBAI..</div>
<div id="footer">♡ CRAFTED BY ARYAN PATIL</div>

<script>
  // 🌍 Scene setup
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({antialias: true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.getElementById("earth-container").appendChild(renderer.domElement);

  // 🖱️ Add OrbitControls for interaction
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.enablePan = false;
  controls.enableZoom = false;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.5;

  // ☀️ Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
  scene.add(ambientLight);
  const light = new THREE.DirectionalLight(0xffffff, 1.2);
  light.position.set(5, 3, 5).normalize();
  scene.add(light);

  // 🌎 Earth texture
  const textureLoader = new THREE.TextureLoader();
  const earthTexture = textureLoader.load('https://threejs.org/examples/textures/land_ocean_ice_cloud_2048.jpg');
  const earthGeo = new THREE.SphereGeometry(2, 64, 64);
  const earthMat = new THREE.MeshPhongMaterial({ map: earthTexture });
  const earth = new THREE.Mesh(earthGeo, earthMat);
  scene.add(earth);

  // ✨ Starfield with blurry, slowly blinking stars
  function createStarTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    gradient.addColorStop(0, 'rgba(255,255,255,1)');
    gradient.addColorStop(0.2, 'rgba(255,255,255,0.7)');
    gradient.addColorStop(0.4, 'rgba(255,255,255,0.1)');
    gradient.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(canvas);
  }

  const starVertices = [];
  for (let i = 0; i < 50000; i++) {
    const x = THREE.MathUtils.randFloatSpread(2000);
    const y = THREE.MathUtils.randFloatSpread(2000);
    const z = THREE.MathUtils.randFloatSpread(2000);
    starVertices.push(x, y, z);
  }
  const starGeometry = new THREE.BufferGeometry();
  starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
  
  const starMaterial = new THREE.PointsMaterial({
    map: createStarTexture(),
    size: 1.5,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  
  const stars = new THREE.Points(starGeometry, starMaterial);
  scene.add(stars);

  // ☄️ Comets (simple blinking dots, no tails)
  const comets = [];
  function spawnComet() {
    const cometGeo = new THREE.SphereGeometry(0.05, 16, 16); // Increased size
    const cometMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true }); // Made transparent for blinking
    const comet = new THREE.Mesh(cometGeo, cometMat);
    
    // Logic to spawn comets on a plane far behind the Earth
    const zPlane = -20;
    const spread = 50;
    const startSide = Math.floor(Math.random() * 4); // 0: top, 1: bottom, 2: left, 3: right
    let startX, startY, targetX, targetY;

    switch(startSide) {
        case 0: // top
            startX = THREE.MathUtils.randFloatSpread(spread);
            startY = spread / 2;
            targetX = THREE.MathUtils.randFloatSpread(spread);
            targetY = -spread / 2;
            break;
        case 1: // bottom
            startX = THREE.MathUtils.randFloatSpread(spread);
            startY = -spread / 2;
            targetX = THREE.MathUtils.randFloatSpread(spread);
            targetY = spread / 2;
            break;
        case 2: // left
            startX = -spread / 2;
            startY = THREE.MathUtils.randFloatSpread(spread);
            targetX = spread / 2;
            targetY = THREE.MathUtils.randFloatSpread(spread);
            break;
        case 3: // right
            startX = spread / 2;
            startY = THREE.MathUtils.randFloatSpread(spread);
            targetX = -spread / 2;
            targetY = THREE.MathUtils.randFloatSpread(spread);
            break;
    }
    
    const startPos = new THREE.Vector3(startX, startY, zPlane);
    comet.position.copy(startPos);
    
    const targetPos = new THREE.Vector3(targetX, targetY, zPlane);
    
    comet.userData.velocity = new THREE.Vector3().subVectors(targetPos, startPos).normalize().multiplyScalar(0.2);

    scene.add(comet);
    comets.push(comet);
  }

  // Set random intervals for comets to appear (more frequent)
  (function cometLoop() {
    const randomInterval = 3000; // Every 3 seconds
    setTimeout(() => {
        spawnComet();
        cometLoop();
    }, randomInterval);
  })();
  

  // 🎥 Static camera
  camera.position.z = 12;
  camera.lookAt(0, 0, 0);

  // 🌐 Animation Loop
  function animate(time) {
    requestAnimationFrame(animate);
    
    TWEEN.update(time);

    // Star blinking
    const blinkTime = Date.now() * 0.0001;
    starMaterial.opacity = 0.6 + Math.sin(blinkTime) * 0.4;
    
    // Comet animation
    for (let i = comets.length - 1; i >= 0; i--) {
        const comet = comets[i];
        comet.position.add(comet.userData.velocity);

        // Add a gentle blinking effect to make them more visible
        comet.material.opacity = 0.7 + Math.sin(Date.now() * 0.005 + i) * 0.3;

        // Remove comet if it goes too far
        if (comet.position.length() > 60) {
            scene.remove(comet);
            comets.splice(i, 1);
        }
    }

    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  // 📱 Responsive layout
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // 🔄 Auto-rotation management
  let inactivityTimer;
  const resumeAutoRotation = () => {
    clearTimeout(inactivityTimer);
    inactivityTimer = setTimeout(() => { controls.autoRotate = true; }, 3000);
  }
  const stopAutoRotation = () => {
    controls.autoRotate = false;
    clearTimeout(inactivityTimer);
  }

  renderer.domElement.addEventListener('mousedown', stopAutoRotation);
  renderer.domElement.addEventListener('mouseup', resumeAutoRotation);
  renderer.domElement.addEventListener('touchstart', stopAutoRotation, { passive: true });
  renderer.domElement.addEventListener('touchend', resumeAutoRotation);

  // 📍 City Markers
  let currentMarker = null;

  function getPositionFromLatLon(lat, lon, radius) {
      const phi = (90 - lat) * (Math.PI / 180);
      const theta = (lon + 180) * (Math.PI / 180);
      
      const x = -(radius * Math.sin(phi) * Math.cos(theta));
      const y = radius * Math.cos(phi);
      const z = radius * Math.sin(phi) * Math.sin(theta);

      return new THREE.Vector3(x, y, z);
  }

  function showCityMarker(lat, lon) {
    // Hide previous marker if it exists
    if(currentMarker) {
        new TWEEN.Tween(currentMarker.material)
            .to({ opacity: 0 }, 500)
            .easing(TWEEN.Easing.Cubic.Out)
            .onComplete(() => scene.remove(currentMarker))
            .start();
    }
    
    const markerGeo = new THREE.ConeGeometry(0.05, 0.2, 16);
    markerGeo.translate(0, 0.1, 0); // Move pivot to the base
    const markerMat = new THREE.MeshBasicMaterial({ color: 0xff4141, transparent: true, opacity: 0 });
    const marker = new THREE.Mesh(markerGeo, markerMat);

    const position = getPositionFromLatLon(lat, lon, 2);
    marker.position.copy(position);
    marker.lookAt(new THREE.Vector3(0, 0, 0));
    marker.rotateX(Math.PI / 2); // Align cone to point outwards

    scene.add(marker);
    currentMarker = marker;

    // Fade in
    new TWEEN.Tween(marker.material)
        .to({ opacity: 1 }, 500)
        .easing(TWEEN.Easing.Cubic.In)
        .delay(500) // Wait for rotation to get closer
        .start();
  }


  // 📍 City Data and Rotation Logic
  const cityCoordinates = {
    "MUMBAI": { lat: 19.0760, lon: 72.8777 }, "NEW YORK": { lat: 40.7128, lon: -74.0060 }, "TOKYO": { lat: 35.6895, lon: 139.6917 },
    "LONDON": { lat: 51.5074, lon: -0.1278 }, "PARIS": { lat: 48.8566, lon: 2.3522 }, "DUBAI": { lat: 25.2048, lon: 55.2708 },
    "SINGAPORE": { lat: 1.3521, lon: 103.8198 }, "BANGALORE": { lat: 12.9716, lon: 77.5946 }, "LOS ANGELES": { lat: 34.0522, lon: -118.2437 },
    "DELHI": { lat: 28.7041, lon: 77.1025 }, "SYDNEY": { lat: -33.8688, lon: 151.2093 }, "ROME": { lat: 41.9028, lon: 12.4964 },
    "CHICAGO": { lat: 41.8781, lon: -87.6298 }, "BANGKOK": { lat: 13.7563, lon: 100.5018 }, "HYDERABAD": { lat: 17.3850, lon: 78.4867 },
    "ISTANBUL": { lat: 41.0082, lon: 28.9784 }, "SEOUL": { lat: 37.5665, lon: 126.9780 }, "MOSCOW": { lat: 55.7558, lon: 37.6173 },
    "MEXICO CITY": { lat: 19.4326, lon: -99.1332 }, "CAPE TOWN": { lat: -33.9249, lon: 18.4241 }, "RIO DE JANEIRO": { lat: -22.9068, lon: -43.1729 },
    "BEIJING": { lat: 39.9042, lon: 116.4074 }, "CHENNAI": { lat: 13.0827, lon: 80.2707 }, "PUNE": { lat: 18.5204, lon: 73.8567 },
  };

  const cities = Object.keys(cityCoordinates);
  
  function pointCameraToCity(lat, lon) {
      stopAutoRotation();

      // Get the target position on the globe's surface in 3D space
      const targetPosition = getPositionFromLatLon(lat, lon, 2);

      // Calculate a new camera position that is along the vector from the origin
      // to the target city, but at the camera's current distance from the origin.
      const cameraDistance = camera.position.length();
      const newCameraPosition = targetPosition.clone().normalize().multiplyScalar(cameraDistance);

      // Use TWEEN to smoothly move the camera.
      new TWEEN.Tween(camera.position)
          .to(newCameraPosition, 1500)
          .easing(TWEEN.Easing.Cubic.InOut)
          .onUpdate(() => {
              // Ensure the camera keeps looking at the center of the Earth during transition.
              camera.lookAt(0, 0, 0);
          })
          .onComplete(() => {
              // Sync OrbitControls with the new camera position for seamless user interaction.
              controls.update();
              resumeAutoRotation();
          })
          .start();
  }


  // 🔀 Shuffle the array initially
  for (let i = cities.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cities[i], cities[j]] = [cities[j], cities[i]];
  }

  const cityElement = document.getElementById("city");

  function typeCity(text, callback) {
    let i = 0;
    cityElement.textContent = "";
    const interval = setInterval(() => {
      cityElement.textContent = text.substring(0, i) + "..";
      i++;
      if (i > text.length) {
        clearInterval(interval);
        if (callback) setTimeout(callback, 1000);
      }
    }, 80);
  }

  let index = 0;
  function showNextCity() {
    if (index >= cities.length) index = 0;
    const cityName = cities[index];
    
    const coords = cityCoordinates[cityName];
    if (coords) {
        setTimeout(() => {
          pointCameraToCity(coords.lat, coords.lon);
          showCityMarker(coords.lat, coords.lon);
        }, 200);
    }
    
    typeCity(cityName, showNextCity);
    index++;
  }

  showNextCity();
</script>
</body>
</html>
