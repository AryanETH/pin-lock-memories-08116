<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Compressor - Mapplock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        .upload-area:hover {
            background: #f8f9ff;
            border-color: #764ba2;
        }
        .upload-area.dragover {
            background: #f0f4ff;
            border-color: #764ba2;
        }
        input[type="file"] {
            display: none;
        }
        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .quality-selector {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        .quality-btn {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            font-weight: 600;
        }
        .quality-btn:hover {
            border-color: #667eea;
        }
        .quality-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }
        .info-box {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }
        .info-box.show {
            display: block;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 14px;
        }
        .info-label {
            color: #666;
        }
        .info-value {
            font-weight: 600;
            color: #333;
        }
        .progress-container {
            margin: 20px 0;
            display: none;
        }
        .progress-container.show {
            display: block;
        }
        .progress-bar {
            height: 40px;
            background: #e0e0e0;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
        }
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }
        video {
            width: 100%;
            border-radius: 10px;
            margin: 10px 0;
            display: none;
        }
        video.show {
            display: block;
        }
        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }
        .success.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Video Compressor</h1>
        <p class="subtitle">Compress your earth-zoom.mp4 for smooth playback</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <p><strong>Click to select video</strong> or drag and drop</p>
            <p style="font-size: 12px; color: #999; margin-top: 5px;">Select your earth-zoom.mp4 file</p>
            <input type="file" id="fileInput" accept="video/*">
        </div>

        <div class="quality-selector">
            <button class="quality-btn active" data-quality="1080p">
                <div>1080p HD</div>
                <div style="font-size: 12px; font-weight: normal; margin-top: 5px;">Recommended</div>
            </button>
            <button class="quality-btn" data-quality="720p">
                <div>720p</div>
                <div style="font-size: 12px; font-weight: normal; margin-top: 5px;">Mobile Optimized</div>
            </button>
        </div>

        <div class="info-box" id="originalInfo">
            <h3 style="margin-bottom: 10px; color: #667eea;">Original Video</h3>
            <div class="info-row">
                <span class="info-label">File Size:</span>
                <span class="info-value" id="originalSize">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Resolution:</span>
                <span class="info-value" id="originalResolution">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Duration:</span>
                <span class="info-value" id="originalDuration">-</span>
            </div>
        </div>

        <video id="originalVideo" controls></video>

        <button class="btn" id="compressBtn" disabled>Compress Video</button>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill">0%</div>
            </div>
            <p style="text-align: center; margin-top: 10px; color: #666; font-size: 14px;" id="progressText">Preparing...</p>
        </div>

        <div class="success" id="successMessage">
            <strong>✅ Compression Complete!</strong>
            <div style="margin-top: 10px;">
                <div class="info-row">
                    <span>New Size:</span>
                    <span id="compressedSize">-</span>
                </div>
                <div class="info-row">
                    <span>Reduction:</span>
                    <span id="sizeReduction">-</span>
                </div>
            </div>
        </div>

        <video id="compressedVideo" controls></video>

        <button class="btn btn-secondary" id="downloadBtn" style="display: none;">Download Compressed Video</button>
    </div>

    <script>
        let selectedFile = null;
        let selectedQuality = '1080p';
        let compressedBlob = null;
        let originalSize = 0;

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const compressBtn = document.getElementById('compressBtn');
        const qualityBtns = document.querySelectorAll('.quality-btn');

        // Upload area click
        uploadArea.addEventListener('click', () => fileInput.click());

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        // File input change
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // Quality selection
        qualityBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                qualityBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedQuality = btn.dataset.quality;
            });
        });

        // Handle file
        function handleFile(file) {
            if (!file.type.startsWith('video/')) {
                alert('Please select a video file');
                return;
            }

            selectedFile = file;
            originalSize = file.size;

            const video = document.getElementById('originalVideo');
            video.src = URL.createObjectURL(file);
            video.classList.add('show');

            video.addEventListener('loadedmetadata', () => {
                document.getElementById('originalSize').textContent = formatSize(file.size);
                document.getElementById('originalResolution').textContent = `${video.videoWidth}x${video.videoHeight}`;
                document.getElementById('originalDuration').textContent = `${video.duration.toFixed(1)}s`;
                document.getElementById('originalInfo').classList.add('show');
                compressBtn.disabled = false;
            });
        }

        // Compress button
        compressBtn.addEventListener('click', compressVideo);

        async function compressVideo() {
            if (!selectedFile) return;

            compressBtn.disabled = true;
            document.getElementById('progressContainer').classList.add('show');
            document.getElementById('successMessage').classList.remove('show');
            document.getElementById('compressedVideo').classList.remove('show');
            document.getElementById('downloadBtn').style.display = 'none';

            updateProgress(10, 'Loading video...');

            try {
                const video = document.createElement('video');
                video.src = URL.createObjectURL(selectedFile);
                video.muted = true;
                await video.play();
                video.pause();
                video.currentTime = 0;

                // Calculate dimensions
                let width, height;
                if (selectedQuality === '1080p') {
                    width = 1920;
                    height = 1080;
                } else {
                    width = 1280;
                    height = 720;
                }

                const aspectRatio = video.videoWidth / video.videoHeight;
                if (video.videoWidth > width) {
                    height = Math.round(width / aspectRatio);
                }

                updateProgress(20, 'Setting up encoder...');

                // Create canvas
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');

                // Setup MediaRecorder
                const stream = canvas.captureStream(30);
                const options = {
                    mimeType: 'video/webm;codecs=vp8',
                    videoBitsPerSecond: selectedQuality === '1080p' ? 2000000 : 1200000
                };

                const mediaRecorder = new MediaRecorder(stream, options);
                const chunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) chunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    compressedBlob = new Blob(chunks, { type: 'video/webm' });
                    showResults();
                };

                updateProgress(30, 'Compressing video...');
                mediaRecorder.start();

                // Render frames
                const fps = 30;
                const frameDuration = 1 / fps;
                const totalFrames = Math.floor(video.duration * fps);
                let currentFrame = 0;

                const renderFrame = () => {
                    if (currentFrame >= totalFrames) {
                        mediaRecorder.stop();
                        return;
                    }

                    const currentTime = currentFrame * frameDuration;
                    video.currentTime = currentTime;

                    video.onseeked = () => {
                        ctx.drawImage(video, 0, 0, width, height);
                        
                        const progress = 30 + (currentFrame / totalFrames) * 65;
                        updateProgress(progress, `Processing frame ${currentFrame + 1}/${totalFrames}...`);
                        
                        currentFrame++;
                        setTimeout(renderFrame, 10);
                    };
                };

                video.currentTime = 0;
                video.onseeked = renderFrame;

            } catch (error) {
                alert('Error compressing video: ' + error.message);
                console.error(error);
                compressBtn.disabled = false;
                document.getElementById('progressContainer').classList.remove('show');
            }
        }

        function showResults() {
            updateProgress(100, 'Complete!');

            const compressedSize = compressedBlob.size;
            const reduction = ((1 - compressedSize / originalSize) * 100).toFixed(1);

            document.getElementById('compressedSize').textContent = formatSize(compressedSize);
            document.getElementById('sizeReduction').textContent = `${reduction}% smaller`;
            document.getElementById('successMessage').classList.add('show');

            const compressedVideo = document.getElementById('compressedVideo');
            compressedVideo.src = URL.createObjectURL(compressedBlob);
            compressedVideo.classList.add('show');

            document.getElementById('downloadBtn').style.display = 'block';
            compressBtn.disabled = false;

            setTimeout(() => {
                document.getElementById('progressContainer').classList.remove('show');
            }, 2000);
        }

        document.getElementById('downloadBtn').addEventListener('click', () => {
            if (!compressedBlob) return;

            const url = URL.createObjectURL(compressedBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'earth-zoom-compressed.webm';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            alert('✅ Downloaded! Now replace public/earth-zoom.mp4 with this file (rename it to earth-zoom.mp4)');
        });

        function updateProgress(percent, text) {
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressFill').textContent = Math.round(percent) + '%';
            document.getElementById('progressText').textContent = text;
        }

        function formatSize(bytes) {
            return (bytes / 1024 / 1024).toFixed(2) + ' MB';
        }
    </script>
</body>
</html>
